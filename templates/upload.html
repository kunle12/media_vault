<!-- templates/upload.html -->
{% extends "layout.html" %}
{% block content %}
<div class="max-w-2xl mx-auto">
    <h1 class="text-2xl font-bold text-gray-900 mb-6">Upload Media</h1>

    <div class="bg-white p-6 rounded-lg shadow">
        <form id="uploadForm" method="POST" action="{{ url_for('upload') }}" enctype="multipart/form-data">
            <div class="mb-6">
                <label for="files" class="block text-sm font-medium text-gray-700 mb-2">Select media files</label>
                <div class="mt-1 flex justify-center px-6 pt-5 pb-6 border-2 border-gray-300 border-dashed rounded-md">
                    <div class="space-y-1 text-center">
                        <svg class="mx-auto h-12 w-12 text-gray-400" stroke="currentColor" fill="none" viewBox="0 0 48 48" aria-hidden="true">
                            <path d="M28 8H12a4 4 0 00-4 4v20m32-12v8m0 0v8a4 4 0 01-4 4H12a4 4 0 01-4-4v-4m32-4l-3.172-3.172a4 4 0 00-5.656 0L28 28M8 32l9.172-9.172a4 4 0 015.656 0L28 28m0 0l4 4m4-24h8m-4-4v8m-12 4h.02" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
                        </svg>
                        <div class="flex text-sm text-gray-600">
                            <label for="files" class="relative cursor-pointer bg-white rounded-md font-medium text-blue-600 hover:text-blue-500 focus-within:outline-none">
                                <span>Upload files</span>
                                <input id="files" name="files" type="file" accept=".mp4,.avi,.mov,.wmv,.flv,.webm,.mp3,.wav,.ogg,.png,.jpg,.jpeg,.gif,.webp,.bmp,.heic" multiple class="sr-only" required>
                            </label>
                            <p class="pl-1">or drag and drop</p>
                        </div>
                        <p class="text-xs text-gray-500">
                            MP4, AVI, MOV, MKV, WMV, FLV, WEBM, MP3, WAV, OGG, PNG, JPG, JPEG, GIF, WEBP, BMP, HEIC up to {{ max_size_mb }}MB each
                        </p>
                    </div>
                </div>
                <div class="mt-2 hidden" id="files-selected">
                    <p class="text-sm text-gray-600">Selected files:</p>
                    <ul id="file-list" class="text-sm text-gray-700 mt-1"></ul>
                </div>
            </div>

            <!-- Upload Progress -->
            <div id="uploadProgress" class="hidden mb-6">
                <p class="text-sm text-gray-600 mb-1" id="uploadStatus">Uploading...</p>
                <div class="w-full bg-gray-200 rounded-full h-2">
                    <div id="progressBar" class="bg-blue-600 h-2 rounded-full transition-all duration-300" style="width: 0%"></div>
                </div>
                <p class="text-xs text-gray-400 mt-1" id="uploadPercent">0%</p>
            </div>

            <div class="flex justify-end">
                <button type="submit" id="submitBtn" class="inline-flex justify-center py-2 px-4 border border-transparent shadow-sm text-sm font-medium rounded-md text-white bg-blue-600 hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500">
                    Upload Files
                </button>
            </div>
        </form>
    </div>
</div>

<script>
    const fileInput = document.getElementById('files');
    const dropZone = document.querySelector('.border-dashed');
    const uploadForm = document.getElementById('uploadForm');
    const submitBtn = document.getElementById('submitBtn');
    const uploadProgress = document.getElementById('uploadProgress');
    const progressBar = document.getElementById('progressBar');
    const uploadStatus = document.getElementById('uploadStatus');
    const uploadPercent = document.getElementById('uploadPercent');
    let dragCounter = 0;

    function updateFileList(files) {
        const fileList = document.getElementById('file-list');
        fileList.innerHTML = '';
        if (files.length > 0) {
            document.getElementById('files-selected').classList.remove('hidden');
            for (let i = 0; i < files.length; i++) {
                const li = document.createElement('li');
                li.textContent = files[i].name;
                fileList.appendChild(li);
            }
        } else {
            document.getElementById('files-selected').classList.add('hidden');
        }
    }

    fileInput.addEventListener('change', function(e) {
        updateFileList(e.target.files);
    });

    dropZone.addEventListener('dragenter', function(e) {
        e.preventDefault();
        dragCounter++;
        if (dragCounter === 1) {
            dropZone.classList.add('border-blue-500', 'bg-blue-50');
        }
    });

    dropZone.addEventListener('dragover', function(e) {
        e.preventDefault();
    });

    dropZone.addEventListener('dragleave', function(e) {
        e.preventDefault();
        dragCounter--;
        if (dragCounter === 0) {
            dropZone.classList.remove('border-blue-500', 'bg-blue-50');
        }
    });

    dropZone.addEventListener('drop', function(e) {
        e.preventDefault();
        dragCounter = 0;
        dropZone.classList.remove('border-blue-500', 'bg-blue-50');

        const droppedFiles = e.dataTransfer.files;
        if (droppedFiles.length === 0) return;

        const dt = new DataTransfer();
        for (const file of droppedFiles) {
            dt.items.add(file);
        }
        fileInput.files = dt.files;
        updateFileList(droppedFiles);
    });

    uploadForm.addEventListener('submit', function(e) {
        e.preventDefault();
        if (!fileInput.files || fileInput.files.length === 0) return;

        submitBtn.disabled = true;
        submitBtn.textContent = 'Uploading...';
        uploadProgress.classList.remove('hidden');
        progressBar.style.width = '0%';
        uploadPercent.textContent = '0%';
        uploadStatus.textContent = 'Uploading files...';

        const formData = new FormData(uploadForm);
        const xhr = new XMLHttpRequest();

        xhr.upload.onprogress = function(event) {
            if (event.lengthComputable) {
                const percent = Math.round((event.loaded / event.total) * 100);
                progressBar.style.width = percent + '%';
                uploadPercent.textContent = percent + '%';
            }
        };

        xhr.onload = function() {
            if (xhr.status === 200) {
                uploadStatus.textContent = 'Upload complete!';
                progressBar.style.width = '100%';
                uploadPercent.textContent = '100%';
                window.location.href = '/dashboard';
            } else {
                uploadStatus.textContent = 'Upload failed. Please try again.';
                progressBar.classList.add('bg-red-600');
                submitBtn.disabled = false;
                submitBtn.textContent = 'Upload Files';
            }
        };

        xhr.onerror = function() {
            uploadStatus.textContent = 'Network error. Please try again.';
            progressBar.classList.add('bg-red-600');
            submitBtn.disabled = false;
            submitBtn.textContent = 'Upload Files';
        };

        xhr.open('POST', uploadForm.action, true);
        xhr.send(formData);
    });
</script>
{% endblock %}
